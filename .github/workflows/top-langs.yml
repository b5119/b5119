name: Update top languages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  top-langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets/top-langs.svg
        env:
          # PAT with `repo` scope so private and collaborator repos are visible
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/top_langs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update top languages chart"
          git pull --rebase
          git push
