<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 28" width="960" height="28" role="presentation" aria-hidden="true">
<defs><linearGradient id="l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop offset="0" stop-color="#2ea043" stop-opacity="0"/><stop offset="0.5" stop-color="#2ea043"/><stop offset="1" stop-color="#2ea043" stop-opacity="0"/></linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe27a" stop-opacity="0"/><stop offset="1" stop-color="#ffe27a"/></linearGradient>
