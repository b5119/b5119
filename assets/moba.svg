<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240"
     font-family="'Fira Code','JetBrains Mono','Segoe UI',monospace" role="img"
     aria-label="A MOBA minimap. From the base (application builder) a champion pushes mid lane toward the enemy nexus, labelled Systems Architect. Three lanes map to domains: top backend, mid systems, bot blockchain. Objective: take the nexus.">
  <defs>
    <linearGradient id="hxgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d488"/>
      <stop offset="1" stop-color="#9a7b3f"/>
    </linearGradient>
    <radialGradient id="champ" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#aed8ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nexus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6da"/>
      <stop offset="0.5" stop-color="#f0d488"/>
      <stop offset="1" stop-color="#9a7b3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="hxglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="238" rx="16" fill="#0a0e14" stroke="#1c2530" stroke-width="1.5"/>

  <!-- corner hextech diamonds -->
  <g fill="none" stroke="#c8aa6e" stroke-width="1" opacity="0.45">
    <path d="M22,22 l8,-8 l8,8 l-8,8 z"/>
    <path d="M930,22 l8,-8 l8,8 l-8,8 z"/>
    <path d="M22,210 l8,-8 l8,8 l-8,8 z"/>
    <path d="M930,210 l8,-8 l8,8 l-8,8 z"/>
  </g>

  <!-- ===================== MINIMAP ===================== -->
  <g>
    <rect x="46" y="40" width="188" height="188" rx="10" fill="#0c1620" stroke="#1c2530" stroke-width="1.5"/>

    <!-- river (perpendicular to mid) -->
    <line x1="60" y1="70" x2="220" y2="206" stroke="#0ac8b9" stroke-width="10" opacity="0.10" stroke-linecap="round"/>

    <!-- lanes -->
    <path d="M74,200 L66,66 L206,66" fill="none" stroke="#283541" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74,200 L212,202 L206,68" fill="none" stroke="#283541" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74,200 L206,68" fill="none" stroke="#34424f" stroke-width="5" stroke-linecap="round"/>
    <!-- mid flowing energy -->
    <path d="M74,200 L206,68" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- towers (squares): yours teal-ish near base, enemy gold near nexus -->
    <g stroke-width="1.4">
      <rect x="112" y="150" width="9" height="9" rx="2" fill="#0e1a1f" stroke="#0ac8b9"/>
      <rect x="154" y="106" width="9" height="9" rx="2" fill="#1a1206" stroke="#c8aa6e"/>
      <rect x="92"  y="118" width="9" height="9" rx="2" fill="#0e1a1f" stroke="#0ac8b9"/>
      <rect x="170" y="168" width="9" height="9" rx="2" fill="#1a1206" stroke="#c8aa6e"/>
    </g>

    <!-- jungle camps -->
    <g fill="#283541">
      <circle cx="110" cy="110" r="2.4"/><circle cx="150" cy="160" r="2.4"/>
      <circle cx="130" cy="135" r="2.4"/><circle cx="96" cy="160" r="2.4"/><circle cx="184" cy="112" r="2.4"/>
    </g>

    <!-- minions marching mid (staggered) -->
    <g fill="#7fe9df">
      <circle r="2.6"><animateMotion path="M74,200 L206,68" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="2.6"><animateMotion path="M74,200 L206,68" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle r="2.6"><animateMotion path="M74,200 L206,68" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- your base (nexus) bottom-left -->
    <circle cx="74" cy="200" r="9" fill="#0b2545" stroke="#58a6ff" stroke-width="2.2"/>
    <circle cx="74" cy="200" r="3" fill="#58a6ff"/>

    <!-- enemy nexus top-right: Systems Architect -->
    <circle cx="206" cy="68" r="16" fill="url(#nexus)" opacity="0.5">
      <animate attributeName="r" values="12;20;12" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M206,58 l8,10 l-8,10 l-8,-10 z" fill="#0d1117" stroke="url(#hxgold)" stroke-width="2"/>
    <path d="M206,63 l4,5 l-4,5 l-4,-5 z" fill="#f0d488"/>

    <!-- champion blip pushing mid -->
    <g filter="url(#hxglow)">
      <g>
        <animateMotion path="M74,200 L206,68" dur="6s" repeatCount="indefinite" calcMode="linear"/>
        <circle r="8" fill="url(#champ)"/>
        <circle r="3.4" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- ===================== OBJECTIVE PANEL ===================== -->
  <text x="288" y="60" fill="#c8aa6e" font-size="13" font-weight="700" letter-spacing="4">MINIMAP &#183;&#183; THE CLIMB</text>
  <line x1="290" y1="72" x2="900" y2="72" stroke="#1c2530" stroke-width="1"/>

  <g font-size="13">
    <circle cx="298" cy="100" r="5" fill="#58a6ff"/>
    <text x="314" y="105" fill="#c9d1d9"><tspan fill="#58a6ff" font-weight="700">Champion</tspan> &#8212; pushing MID: Distributed Systems &#183; <tspan fill="#8b949e">currently here</tspan></text>

    <circle cx="298" cy="132" r="5" fill="#0ac8b9"/>
    <text x="314" y="137" fill="#c9d1d9">Lanes &#8212; TOP <tspan fill="#7ee787">backend</tspan> &#183; MID <tspan fill="#58a6ff">systems</tspan> &#183; BOT <tspan fill="#d2a8ff">blockchain</tspan></text>

    <path d="M298,158 l5,7 l-5,7 l-5,-7 z" fill="#f0d488"/>
    <text x="314" y="170" fill="#c9d1d9">Objective &#8212; take the enemy Nexus: <tspan fill="#f0d488" font-weight="700">Systems Architect</tspan></text>
  </g>

  <text x="314" y="205" fill="#6e7681" font-size="11.5">Q build &#183; W ship &#183; E debug &#183; R architect &#8212; <tspan fill="#c8aa6e">the glorious evolution</tspan></text>
</svg>
