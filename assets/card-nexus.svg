<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" role="img" aria-label="Nexus: a personal device mesh built in Rust">
<defs><linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050807"/><stop offset="1" stop-color="#0b1812"/></linearGradient>
<linearGradient id="nsw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc84" stop-opacity="0"/><stop offset="0.5" stop-color="#3ddc84" stop-opacity="0.12"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></linearGradient>
<filter id="ng" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="nc"><rect x="1" y="1" width="958" height="168" rx="14"/></clipPath></defs>
<rect x="1" y="1" width="958" height="168" rx="14" fill="url(#nbg)" stroke="#1f3a2b" stroke-width="1.5"/>
<g clip-path="url(#nc)"><rect x="-240" y="0" width="240" height="170" fill="url(#nsw)"><animate attributeName="x" values="-240;960" dur="8s" repeatCount="indefinite"/></rect></g>

<g transform="translate(90 85)" filter="url(#ng)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/><polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#2ea043" stroke-width="1.6"/></g><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/><polygon points="0,-34 29,17 -29,17" fill="none" stroke="#c9a227" stroke-width="1.4"/></g><circle r="3.5" fill="#3ddc84"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle></g>
<text x="170" y="62" font-size="30" font-weight="700" letter-spacing="4" fill="#3ddc84" filter="url(#ng)">NEXUS</text>
<text x="170" y="88" font-size="14" fill="#cfe8d8">Personal device mesh — files, screen and app state across your own devices</text>
<rect x="170" y="104" width="52" height="22" rx="11" fill="#0f2418" stroke="#1f3a2b"/><text x="196" y="119" text-anchor="middle" font-size="11.5" fill="#a9d6bb">Rust</text>
<rect x="230.4" y="104" width="60" height="22" rx="11" fill="#0f2418" stroke="#1f3a2b"/><text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#a9d6bb">Tokio</text>
<rect x="298.4" y="104" width="52" height="22" rx="11" fill="#0f2418" stroke="#1f3a2b"/><text x="325" y="119" text-anchor="middle" font-size="11.5" fill="#a9d6bb">gRPC</text>
<rect x="358.79999999999995" y="104" width="52" height="22" rx="11" fill="#0f2418" stroke="#1f3a2b"/><text x="385" y="119" text-anchor="middle" font-size="11.5" fill="#a9d6bb">FUSE</text>
<rect x="419.19999999999993" y="104" width="52" height="22" rx="11" fill="#0f2418" stroke="#1f3a2b"/><text x="445" y="119" text-anchor="middle" font-size="11.5" fill="#a9d6bb">mTLS</text>
<text x="170" y="150" font-size="12" fill="#c9a227" letter-spacing="1">100+ TESTS  ·  17 ADRs  ·  VECTOR-CLOCK CONFLICT DETECTION</text>
<rect x="732" y="26" width="198" height="24" rx="12" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.6"/><text x="831.0" y="42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#3ddc84">IN ACTIVE DEVELOPMENT<animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/></text>
</svg>
